name: reproducibility-smoke-test

on:
  push:
    paths:
      - "evaluation/**"
      - ".github/workflows/reproducibility.yml"
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/reproducibility.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: pip install -r evaluation/requirements.txt
      - name: Compile scripts
        run: python -m py_compile evaluation/*.py
      - name: Run evaluation smoke test
        run: python evaluation/tests/smoke_test.py
      - name: Reproduce public annotation audit
        run: python evaluation/tests/public_audit_repro_test.py
      - name: Run public reproducibility entry point
        run: python evaluation/run_reproducibility.py --out /tmp/fst-repro
